{% extends 'base.html' %}

{% block title %}Password Reset Complete – BUG HUNTERS{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 5rem auto; padding: 0 1.5rem; text-align: center;">
    <div class="glass-panel" style="padding: 3rem 2rem;">
        <div style="width: 65px; height: 65px; border-radius: 50%; background: rgba(16, 185, 129, 0.15); border: 2px solid #10b981; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; color: #10b981; margin: 0 auto 1.5rem;">
            <i class="fas fa-check-double"></i>
        </div>
        <h2 style="font-size: 1.8rem; font-weight: 800; color: #fff; margin-bottom: 0.75rem;">
            Password Updated!
        </h2>
        <p style="color: var(--text-muted); line-height: 1.6; margin-bottom: 2rem;">
            Your password has been successfully reset. You may now log in to your participant dashboard.
        </p>
        <a href="{% url 'login' %}" class="btn-cyber">
            <i class="fas fa-sign-in-alt"></i> Proceed to Login
        </a>
    </div>
</div>
{% endblock %}
