{% extends 'base.html' %}

{% block title %}Reset Password – BUG HUNTERS 2026{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 4rem auto; padding: 0 1.5rem 5rem;">
    <div class="glass-panel" style="padding: 2.8rem 2.2rem;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div style="width: 54px; height: 54px; border-radius: 12px; background: rgba(0, 240, 255, 0.15); border: 1px solid var(--border-cyan); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: var(--cyber-cyan); margin: 0 auto 1rem;">
                <i class="fas fa-key"></i>
            </div>
            <h2 style="font-size: 1.9rem; font-weight: 800; color: #fff; margin-bottom: 0.5rem;">
                Password Recovery
            </h2>
            <p style="color: var(--text-muted); font-size: 0.92rem; line-height: 1.5;">
                Enter the email address registered with your participant profile. We will generate a secure reset link.
            </p>
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label">Registered Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="name@college.edu" required autofocus>
            </div>

            <div style="margin: 2rem 0 1.5rem;">
                <button type="submit" class="btn-cyber" style="width: 100%; justify-content: center; padding: 0.85rem; font-size: 1rem;">
                    <i class="fas fa-paper-plane"></i> Send Password Reset Link
                </button>
            </div>

            <div style="text-align: center; font-size: 0.9rem;">
                <a href="{% url 'login' %}" style="color: var(--text-dim); text-decoration: none;">
                    <i class="fas fa-arrow-left"></i> Return to Login
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
