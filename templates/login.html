{% extends 'base.html' %}

{% block title %}Participant Login – BUG HUNTERS 2026{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 4rem auto; padding: 0 1.5rem 5rem;">
    <div class="glass-panel" style="padding: 2.8rem 2.2rem;">
        <div style="text-align: center; margin-bottom: 2.2rem;">
            <div style="width: 54px; height: 54px; border-radius: 12px; background: rgba(0, 240, 255, 0.15); border: 1px solid var(--border-cyan); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: var(--cyber-cyan); margin: 0 auto 1rem;">
                <i class="fas fa-sign-in-alt"></i>
            </div>
            <h2 style="font-size: 2rem; font-weight: 800; color: #fff; margin-bottom: 0.5rem;">
                Contestant Login
            </h2>
            <p style="color: var(--text-muted); font-size: 0.95rem;">
                Enter your credentials to access the competition rounds.
            </p>
        </div>

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}

            <div class="form-group">
                <label class="form-label">Username or Academic Email</label>
                <div style="position: relative;">
                    <input type="text" name="username" class="form-control" placeholder="Enter username or email" required autofocus>
                </div>
            </div>

            <div class="form-group">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                    <label class="form-label" style="margin-bottom: 0;">Password</label>
                    <a href="{% url 'password_reset' %}" style="font-size: 0.8rem; color: var(--cyber-cyan); text-decoration: none;">Forgot password?</a>
                </div>
                <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
            </div>

            <div style="margin: 2rem 0 1.5rem;">
                <button type="submit" class="btn-cyber" style="width: 100%; justify-content: center; padding: 0.85rem; font-size: 1.05rem;">
                    <i class="fas fa-bolt"></i> Authenticate &amp; Access Arena
                </button>
            </div>

            <div style="text-align: center; font-size: 0.9rem; color: var(--text-dim);">
                New participant? <a href="{% url 'register' %}" style="color: var(--cyber-cyan); text-decoration: none; font-weight: 600;">Register an account</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
